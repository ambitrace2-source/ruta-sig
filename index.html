<!doctype html>
<html lang="es-CO"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E69"><link rel="manifest" href="manifest.json"><link rel="icon" href="icono.svg">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}body{margin:0}[hidden]{display:none!important}</style>

<title>Ruta SIG</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: una sola columna de teléfono (máx. 30rem), botones grandes; la retroalimentación es un "sello" de auditoría (Conforme / No conforme) con la cláusula como referencia. */
:root{
  --bg:#EEF2F1;--surface:#FFFFFF;--ink:#12262B;--muted:#55696E;--line:#C9D5D3;
  --accent:#0B6E69;--accent-ink:#FFFFFF;--gold:#9A6400;
  --ok:#1D7A46;--ok-bg:#DDF2E4;--bad:#B3261E;--bad-bg:#FBE3E0;
  --display:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1A1D;--surface:#172A2F;--ink:#E6EFEE;--muted:#9DB1B5;--line:#2F474D;
  --accent:#4FD1C5;--accent-ink:#06211F;--gold:#F2B84B;
  --ok:#6FD99A;--ok-bg:#12331F;--bad:#FF9A8F;--bad-bg:#3D1A17;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A1D;--surface:#172A2F;--ink:#E6EFEE;--muted:#9DB1B5;--line:#2F474D;
  --accent:#4FD1C5;--accent-ink:#06211F;--gold:#F2B84B;
  --ok:#6FD99A;--ok-bg:#12331F;--bad:#FF9A8F;--bad-bg:#3D1A17;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body);
  padding-block:1rem 2rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:30rem;margin:0 auto;display:flex;flex-direction:column;gap:1rem}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:1.6rem}h2{font-size:1.2rem}h3{font-size:1.25rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,audio:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.muted{color:var(--muted);font-size:.875rem}
.medidores{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.medidor{background:var(--surface);border:1px solid var(--line);border-radius:.75rem;padding:.6rem .5rem;text-align:center;min-width:0}
.medidor b{display:block;font:700 1.5rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.medidor.xp b{color:var(--gold)}
.medidor span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.btn{min-height:3.25rem;width:100%;border:0;border-radius:.9rem;padding:.75rem 1rem;font-weight:600;
  background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:default}
.unidad{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1rem;display:flex;flex-direction:column;gap:.75rem}
.unidad.bloq{opacity:.6}
.unidad header{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem}
.barra{height:.5rem;border-radius:1rem;background:var(--line);overflow:hidden;flex:1}
.barra i{display:block;height:100%;background:var(--accent);transition:width .3s}
audio{width:100%;height:2.5rem}
.leccion{display:flex;align-items:center;gap:.75rem;width:100%;min-height:3.25rem;text-align:left;
  background:var(--bg);border:1px solid var(--line);border-radius:.75rem;padding:.6rem .75rem}
.leccion .n{flex:none;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;font:700 .95rem var(--display);
  border:2px solid var(--accent);color:var(--accent)}
.leccion:disabled{opacity:.5;cursor:default}
.leccion.hecha .n{background:var(--accent);color:var(--accent-ink)}
.leccion .t{flex:1;min-width:0}
.leccion .p{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.top{display:flex;align-items:center;gap:.75rem}
.salir{background:none;border:1px solid var(--line);border-radius:.6rem;min-height:2.75rem;padding:0 .75rem;color:var(--muted)}
.tipo{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.hueco{display:inline-block;min-width:4.5rem;border-bottom:2px solid var(--accent);color:var(--accent);text-align:center;font-weight:600}
.ops{display:flex;flex-direction:column;gap:.6rem}
.op{min-height:3.25rem;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:.9rem;padding:.7rem .9rem}
.op.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.op.bien{border-color:var(--ok);background:var(--ok-bg)}
.op.mal{border-color:var(--bad);background:var(--bad-bg)}
.op:disabled{cursor:default;color:inherit}
.op.hecho{opacity:.55;border-style:dashed}
.sec{margin:0;padding-left:1.6rem;display:flex;flex-direction:column;gap:.5rem;min-height:3.25rem;
  border:2px dashed var(--line);border-radius:.9rem;padding-block:.5rem;padding-right:.5rem}
.sec:empty::before{content:"Su orden aparecerá aquí";color:var(--muted);font-size:.875rem;margin-left:-.8rem;align-self:center}
.pares{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.pares .ops{min-width:0}
.pares .op{font-size:.9rem;padding:.6rem;overflow-wrap:anywhere}
.sello{border-radius:1rem;padding:1rem;display:flex;flex-direction:column;gap:.6rem;border:2px solid var(--ok);background:var(--ok-bg)}
.sello.nc{border-color:var(--bad);background:var(--bad-bg)}
.sello .marca{font:700 1.05rem var(--display);text-transform:uppercase;letter-spacing:.05em;color:var(--ok)}
.sello.nc .marca{color:var(--bad)}
.ref{font-size:.8rem;font-weight:600;border:1px solid currentColor;border-radius:.4rem;padding:.15rem .45rem;align-self:flex-start;color:var(--muted)}
.fin{text-align:center;display:flex;flex-direction:column;gap:1rem;padding-block:1.5rem}
.btn.sec{background:var(--surface);color:var(--accent);border:2px solid var(--accent);box-shadow:none}
summary{cursor:pointer;font-weight:600;min-height:2.75rem;display:flex;align-items:center}
summary:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.copia{display:flex;flex-direction:column;gap:.6rem;margin-top:.5rem}
.fila{display:grid;grid-template-columns:minmax(0,8.5rem) 1fr 2.8rem;gap:.5rem;align-items:center;font-size:.85rem}
.fila>span{overflow-wrap:anywhere}
.fila b{text-align:right;font-variant-numeric:tabular-nums}
.fila small{grid-column:3;text-align:right;margin-top:-.4rem}
.barra.meta i{background:var(--ok)}
.sub{font-size:1rem}
.debiles{margin:0;padding-left:1.1rem;display:flex;flex-direction:column;gap:.35rem;font-size:.875rem}
details summary{font-weight:400}
textarea{width:100%;font:.8rem/1.4 ui-monospace,Consolas,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:.6rem;padding:.5rem;resize:vertical;overflow-wrap:anywhere}
.chat{display:flex;flex-direction:column;gap:.5rem}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;padding:.6rem .8rem;border-radius:.9rem;background:var(--surface);border:1px solid var(--line);max-width:92%;align-self:flex-start}
.msg.yo{align-self:flex-end;background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
#duda,#clave{width:100%;font:400 1rem/1.4 var(--body);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:.6rem;padding:.6rem}
#clave{min-height:3rem}
#clave:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<main id="app"><p class="muted">Cargando el banco de preguntas…</p></main>

<script>
const K='rutaSIG.v1', DIA=864e5, EXAMEN=new Date(2026,10,18);
const INTERVALO=[0,0,1,2,4,7]; // días hasta el próximo repaso según la caja Leitner (1 a 5)
const TIPOS={om:'Opción múltiple',vf:'Verdadero o falso',completar:'Complete la frase',ordenar:'Ordene',emparejar:'Empareje'};
const app=document.getElementById('app');
const VACIO=()=>({xp:0,racha:0,ultimo:0,t:0,cajas:{},lecc:{},oidos:{},examenes:[]});
const APRUEBA=.8; // aciertos mínimos de una lección para abrir la siguiente
const PESO=[0,0,.5,.75,1,1]; // dominio según caja Leitner: fallada 0, acertada una vez 50 %, consolidada 100 %
const META=80;
let B, S=VACIO(), Z, P, ref=null, sync='', escribiendo=false, pendiente=false, tSubir, confirmar=false;

// Valida todo progreso que entra de fuera (código pegado, nube o almacenamiento): solo números y forma esperada.
function limpiar(d){
  if(!d||typeof d!=='object')throw new Error('formato');
  const n=v=>Number.isFinite(v)&&v>=0?Math.floor(v):0, o=VACIO();
  o.xp=n(d.xp);o.racha=n(d.racha);o.ultimo=n(d.ultimo);o.t=n(d.t);
  for(const[k,v]of Object.entries(d.cajas||{}))if(v&&v.c>=1&&v.c<=5&&Number.isFinite(v.v))o.cajas[k]={c:Math.floor(v.c),v:Math.floor(v.v)};
  for(const[k,v]of Object.entries(d.lecc||{}))if(Number.isFinite(v))o.lecc[k]=n(v);
  for(const k of Object.keys(d.oidos||{}))if(/^U\d+(L\d+)?$/.test(k))o.oidos[k]=1;
  const s=d.sesion;
  if(s&&Array.isArray(s.ids)&&s.ids.every(x=>typeof x==='string')&&['leccion','repaso','examen'].includes(s.tipo))
    o.sesion={tipo:s.tipo,ids:s.ids.slice(0,60),i:n(s.i),ok:n(s.ok),xp:n(s.xp),clave:typeof s.clave==='string'?s.clave:undefined,
      fallas:Array.isArray(s.fallas)?s.fallas.filter(x=>typeof x==='string').slice(0,60):[],t0:n(s.t0)};
  o.examenes=(Array.isArray(d.examenes)?d.examenes:[]).filter(e=>e&&Number.isFinite(e.ok)&&Number.isFinite(e.n)).slice(-10).map(e=>{
    const p={};for(const[k,v]of Object.entries(e.porU||{}))if(Array.isArray(v)&&v.length===2&&v.every(Number.isFinite))p[k]=[n(v[0]),n(v[1])];
    return{t:n(e.t),ok:n(e.ok),n:n(e.n),porU:p}});
  return o;
}
function codigo(s=S){let b='';for(const x of new TextEncoder().encode(JSON.stringify(limpiar(s))))b+=String.fromCharCode(x);return 'SIG1.'+btoa(b)}
function leerCodigo(c){c=c.trim();if(!c.startsWith('SIG1.'))throw new Error('prefijo');return limpiar(JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(c.slice(5)),ch=>ch.charCodeAt(0)))))}
{const m={xp:30,racha:2,ultimo:5,t:9,cajas:{'U1L1-01':{c:3,v:7}},lecc:{U1L1:8},sesion:{tipo:'leccion',ids:['U1L1-01'],i:1,ok:1,xp:10,clave:'U1L1'}};
 console.assert(JSON.stringify(leerCodigo(codigo(m)))===JSON.stringify(limpiar(m)),'codigo ida y vuelta');
 console.assert(limpiar({xp:-5,cajas:{a:{c:9,v:1}}}).xp===0&&!limpiar({cajas:{a:{c:9,v:1}}}).cajas.a,'limpiar')}

try{S=limpiar(JSON.parse(localStorage.getItem(K))||{})}catch(e){}
const guardarLocal=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const guardar=()=>{S.t=Date.now();guardarLocal();if(ref){clearTimeout(tSubir);tSubir=setTimeout(subir,1500)}};
function avisar(t){sync=t;const e=document.getElementById('sync');if(e)e.textContent=t}

// Nube: solo existe dentro del Artifact de claude.ai (sesión del Señor). Fuera de él, window.claude no existe y todo queda local.
async function nube(){
  const use=window.claude&&window.claude.use; if(!use)return;
  const [db,user]=await Promise.all([use('db'),use('user')]); if(!db||!user)return;
  const id=await user.id(); if(!id)return;
  const r=db.doc('data/users/'+id+'/progreso');
  avisar('Sincronizando con su cuenta…');
  const espera=setTimeout(()=>avisar('Aún no se pudo conectar con su cuenta; el progreso sigue guardado en este dispositivo.'),10000);
  try{
    const s=await r.get(); clearTimeout(espera);
    const d=s.exists?limpiar(s.data()):null; ref=r;
    if(d&&d.t>S.t&&!Z){S=d;guardarLocal();inicio()}
    else if(!d||d.t<S.t)subir();
    avisar('Progreso sincronizado con su cuenta de Claude.');
  }catch(e){clearTimeout(espera);avisar('No se pudo sincronizar; el progreso sigue guardado en este dispositivo.')}
}
async function subir(){
  if(!ref)return; if(escribiendo){pendiente=true;return}
  escribiendo=true;
  try{await ref.set(JSON.parse(JSON.stringify(S)));avisar('Progreso sincronizado con su cuenta de Claude.')}
  catch(e){avisar('No se pudo guardar en su cuenta; el progreso sigue en este dispositivo.')}
  escribiendo=false; if(pendiente){pendiente=false;subir()}
}
const hoy=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/DIA);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dias=n=>n+(n===1?' día':' días');
function mezclar(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// Leitner: acierto sube de caja (tope 5), fallo vuelve a la caja 1 y queda para hoy mismo.
function leitner(c,ok,d){const caja=ok?Math.min(5,(c?c.c:1)+1):1;return{c:caja,v:d+INTERVALO[caja]}}
function sumarRacha(s,d){if(s.ultimo!==d){s.racha=s.ultimo===d-1?s.racha+1:1;s.ultimo=d}}
console.assert(leitner(undefined,true,10).v===11&&leitner({c:4},false,10).v===10&&leitner({c:5},true,0).c===5,'leitner');
{const t={racha:3,ultimo:9};sumarRacha(t,10);sumarRacha(t,10);console.assert(t.racha===4,'racha');sumarRacha(t,13);console.assert(t.racha===1,'racha rota')}

const pendientes=()=>B.preguntas.filter(q=>S.cajas[q.id]&&S.cajas[q.id].v<=hoy()).sort((a,b)=>S.cajas[a.id].c-S.cajas[b.id].c).slice(0,15);
const deLeccion=(u,l)=>B.preguntas.filter(q=>q.unidad===u&&q.leccion===l);
const TANDA=10; // preguntas por intento, sorteadas del banco de la lección
const tamano=(u,l)=>Math.min(TANDA,deLeccion(u,l).length);
const aprobada=(u,l)=>(S.lecc[u+'L'+l]||0)>=Math.ceil(APRUEBA*tamano(u,l));
// Sorteo: primero las nunca vistas, luego las demás al azar; la tanda va de fácil a difícil.
function tanda(u,l){
  const p=mezclar(deLeccion(u,l)).sort((a,b)=>!!S.cajas[a.id]-!!S.cajas[b.id]);
  return p.slice(0,TANDA).sort((a,b)=>(a.dificultad||2)-(b.dificultad||2));
}
const moduloOk=u=>u.lecciones.every((_,i)=>aprobada(u.id,i+1));

// Modo libre: abre todos los módulos y lecciones solo en este dispositivo (no viaja con el progreso).
const KT='rutaSIG.libre'; let todo=false; try{todo=!!localStorage.getItem(KT)}catch(e){}

function inicio(){
  Z=P=null;
  const d=hoy(), faltan=Math.ceil((EXAMEN-Date.now())/DIA), rep=pendientes().length;
  const abierto=B.unidades.findIndex(u=>!moduloOk(u)); // primer módulo sin aprobar; -1 = todos aprobados
  app.innerHTML=`<h1>Ruta SIG</h1>
  <div class="medidores">
    <div class="medidor"><b>${S.ultimo>=d-1?S.racha:0}</b><span>Racha (días)</span></div>
    <div class="medidor xp"><b>${S.xp}</b><span>XP</span></div>
    <div class="medidor"><b>${Math.max(0,faltan)}</b><span>Días al 18-nov</span></div>
  </div>
  ${S.sesion?`<button class="btn" data-continuar>Continuar ${{leccion:'lección',repaso:'repaso',examen:'evaluación final'}[S.sesion.tipo]} · pregunta ${Math.min(S.sesion.i+1,S.sesion.ids.length)} de ${S.sesion.ids.length}</button>`:''}
  <button class="btn ${S.sesion?'sec':''}" data-repaso ${rep?'':'disabled'}>${rep?`Repaso del día · ${rep} ${rep===1?'pregunta':'preguntas'}`:'Sin repasos pendientes hoy'}</button>
  <button class="btn sec" data-chat>Pregunte a Jarvis sobre las normas</button>
  ${panel()}
  ${B.unidades.map((u,k)=>{
    const dm=dominio(u.id), hecho=abierto<0||k<abierto, titulo=`<h2>Módulo ${k+1} · ${esc(u.titulo)}</h2>`;
    if(!todo&&!hecho&&k>abierto)return `<section class="unidad bloq"><header>${titulo}<span class="muted">Bloqueado</span></header>
      <p class="muted">Se abre al aprobar el módulo ${k}.</p></section>`;
    const oido=hecho||S.oidos[u.id];
    return `<section class="unidad"><header>${titulo}<span class="muted">${hecho?'Aprobado · ':''}${dm} % dominio</span></header>
    <div class="barra"><i style="width:${dm}%"></i></div>
    <div><p class="muted">Paso 1 · Escuche la audio-clase</p><audio controls preload="none" data-audio="${u.id}" src="audio/${esc(u.audio)}"></audio>
      ${oido?'<p class="muted">✓ Audio-clase escuchada</p>':`<button class="btn sec" data-oido="${u.id}">Ya la escuché · abrir la lección 1</button>`}</div>
    ${u.lecciones.map((t,i)=>{const k=u.id+'L'+(i+1), m=S.lecc[k], n=tamano(u.id,i+1), ap=aprobada(u.id,i+1);
      // Lección con audio propio: se abre al aprobar la anterior y escuchar su audio.
      const al=u.audios_leccion&&u.audios_leccion[i+1], oidoL=!al||hecho||ap||S.oidos[k], previa=todo||(i?aprobada(u.id,i):oido), libre=todo||(previa&&oidoL);
      const pre=al&&previa?`<div><p class="muted">Antes de la lección ${i+1} · Escuche su audio-clase</p><audio controls preload="none" data-audio="${k}" src="audio/${esc(al)}"></audio>
        ${oidoL?'<p class="muted">✓ Audio-clase escuchada</p>':`<button class="btn sec" data-oido="${k}">Ya la escuché · abrir la lección ${i+1}</button>`}</div>`:'';
      return `${pre}<button class="leccion ${ap?'hecha':''}" data-u="${u.id}" data-l="${i+1}" ${libre?'':'disabled'}><span class="n">${ap?'✓':i+1}</span><span class="t">${esc(t)}</span><span class="p">${m!=null?Math.min(m,n)+'/'+n:libre?'Nueva':'Bloqueada'}</span></button>`}).join('')}
    <p class="muted">Apruebe cada lección con ${Math.round(APRUEBA*100)} % para abrir la siguiente.</p>
    </section>`}).join('')}
  <section class="unidad ${abierto<0?'':'bloq'}"><header><h2>Evaluación final</h2><span class="muted">${abierto<0?'Abierta':'Bloqueada'}</span></header>
    <p class="muted">${abierto<0?'40 preguntas de los 9 módulos. Sin correcciones hasta el final.':'Se abre al aprobar los 9 módulos.'}</p>
    <button class="btn" data-examen ${abierto<0?'':'disabled'}>Presentar la evaluación final</button></section>
  <section class="unidad"><h2>Su progreso</h2>
    <p class="muted" id="sync">${esc(sync||'Guardado en este dispositivo.')}</p>
    <p class="muted" id="offline"></p>
    <button class="btn sec" data-todo>${todo?'Volver al orden paso a paso':'Abrir todos los módulos en este dispositivo'}</button>
    <details><summary>Copia de seguridad</summary><div class="copia">
      <p class="muted">Guarde este código en una nota o envíeselo a sí mismo. Con él recupera el progreso en otro celular o navegador.</p>
      <textarea id="codigo" rows="3" readonly aria-label="Código de su progreso">${codigo()}</textarea>
      <button class="btn" data-copiar>Copiar código</button>
      <label for="restaurar" class="muted">Restaurar desde un código</label>
      <textarea id="restaurar" rows="3" placeholder="Pegue aquí el código SIG1…"></textarea>
      <button class="btn sec" data-restaurar>Restaurar progreso</button>
      <p class="muted" id="msg" role="status"></p>
    </div></details>
  </section>`;
  confirmar=false;
  if(navigator.serviceWorker)navigator.serviceWorker.ready.then(()=>{const e=document.getElementById('offline');if(e)e.textContent='Lista para usar sin conexión: preguntas y audios descargados.'});
}
function mensaje(t){const e=document.getElementById('msg');if(e)e.textContent=t}
function reanudar(){
  const s=S.sesion, m=new Map(B.preguntas.map(q=>[q.id,q])), cola=s.ids.map(i=>m.get(i)).filter(Boolean);
  if(!cola.length){delete S.sesion;guardar();return inicio()}
  Z={tipo:s.tipo,cola,clave:s.clave,i:Math.min(s.i,cola.length),ok:s.ok,xp:s.xp,fallas:s.fallas||[],t0:s.t0||Date.now()};
  Z.i<cola.length?nueva():terminar();
}

function dominio(u){const qs=B.preguntas.filter(q=>q.unidad===u);return qs.length?Math.round(100*qs.reduce((s,q)=>s+(S.cajas[q.id]?PESO[S.cajas[q.id].c]:0),0)/qs.length):0}
function textoCorrecta(q){return q.tipo==='ordenar'?q.opciones.join(' → '):q.tipo==='emparejar'?q.opciones.map(p=>p.join(' ↔ ')).join(' · '):q.opciones[q.correcta]}
// Toma preguntas por turnos de cada unidad para que el simulacro cubra todas las normas.
function armarExamen(n=40){
  const g=B.unidades.map(u=>mezclar(B.preguntas.filter(q=>q.unidad===u.id))), c=[];
  for(let i=0;c.length<n&&g.some(x=>x.length);i=(i+1)%g.length)if(g[i].length)c.push(g[i].pop());
  return mezclar(c);
}
function filaNorma(titulo,pct,extra=''){return `<div class="fila"><span>${esc(titulo)}</span><div class="barra ${pct>=META?'meta':''}"><i style="width:${pct}%"></i></div><b>${pct} %</b>${extra}</div>`}
function panel(){
  const vistas=Object.keys(S.cajas).length; if(!vistas)return '';
  const refs=[...new Set(B.preguntas.filter(q=>S.cajas[q.id]&&S.cajas[q.id].c===1).map(q=>q.referencia))].slice(0,6);
  const ult=S.examenes[S.examenes.length-1];
  return `<section class="unidad"><h2>Dominio por norma</h2>
    ${B.unidades.map(u=>filaNorma(u.titulo,dominio(u.id))).join('')}
    <p class="muted">Sube al acertar y al repasar. Meta antes del miércoles: ${META} % en cada norma.</p>
    ${refs.length?`<h3 class="sub">Temas para reforzar</h3><ul class="debiles">${refs.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:''}
    ${ult?`<p class="muted">Último simulacro: ${Math.round(100*ult.ok/ult.n)} % (${ult.ok} de ${ult.n}).</p>`:''}
  </section>`;
}
function resultadoExamen(){
  const f=new Set(Z.fallas), porU={}, n=Z.cola.length;
  for(const q of Z.cola){const r=porU[q.unidad]||(porU[q.unidad]=[0,0]);r[1]++;if(!f.has(q.id))r[0]++}
  const pct=Math.round(100*Z.ok/n), min=Math.max(1,Math.round((Date.now()-Z.t0)/6e4));
  S.examenes=S.examenes.concat({t:Date.now(),ok:Z.ok,n,porU}).slice(-10);
  const fallos=Z.cola.filter(q=>f.has(q.id));
  app.innerHTML=`<div class="fin"><h1>Simulacro: ${pct} %</h1>
    <p>${Z.ok} de ${n} correctas en ${min} min. ${pct>=META?'Meta cumplida.':`La meta es ${META} %: refuerce las normas en rojo.`}</p></div>
  <section class="unidad"><h2>Resultado por norma</h2>
    ${B.unidades.filter(u=>porU[u.id]).map(u=>{const[o,t]=porU[u.id];return filaNorma(u.titulo,Math.round(100*o/t),`<small class="muted">${o}/${t}</small>`)}).join('')}
  </section>
  ${fallos.length?`<section class="unidad"><h2>Revise sus fallos</h2>
    ${fallos.map(q=>`<details><summary>${esc(q.enunciado)}</summary><div class="copia">
      <p><b>Respuesta correcta:</b> ${esc(textoCorrecta(q))}</p><p><b>Por qué:</b> ${esc(q.explicacion)}</p><p class="ref">${esc(q.referencia)}</p></div></details>`).join('')}
    <p class="muted">Estas preguntas quedaron en el Repaso del día.</p></section>`:''}
  <button class="btn" data-salir>Volver a la ruta</button>`;
}
function empezar(tipo,cola,clave){Z={tipo,cola,clave,i:0,ok:0,xp:0,fallas:[],t0:Date.now()};nueva()}
function nueva(){
  S.sesion={tipo:Z.tipo,ids:Z.cola.map(q=>q.id),i:Z.i,ok:Z.ok,xp:Z.xp,clave:Z.clave,fallas:Z.fallas,t0:Z.t0}; guardar();
  const q=Z.cola[Z.i], idx=[...q.opciones.keys()];
  P={q,res:null,sel:null,sec:[],izq:null,mal:null,err:0,hechos:[],hechosD:[],ord:q.tipo==='vf'?idx:mezclar(idx),ord2:mezclar(idx)};
  pregunta();
}
function pregunta(){
  const q=P.q, fin=P.res!==null, off=fin?'disabled':'';
  let enun=esc(q.enunciado), cuerpo, listo=true;
  if(q.tipo==='ordenar'){
    listo=P.sec.length===q.opciones.length;
    cuerpo=`<p class="muted">Toque las tarjetas en orden. Toque una ya colocada para devolverla.</p>
    <ol class="sec">${P.sec.map(i=>`<li><button class="op" data-quitar="${i}" ${off}>${esc(q.opciones[i])}</button></li>`).join('')}</ol>
    <div class="ops">${P.ord.filter(i=>!P.sec.includes(i)).map(i=>`<button class="op" data-poner="${i}" ${off}>${esc(q.opciones[i])}</button>`).join('')}</div>`;
  }else if(q.tipo==='emparejar'){
    listo=false;
    const col=(ord,lado,k)=>`<div class="ops">${ord.map(i=>{const h=(lado==='izq'?P.hechos:P.hechosD).includes(i);
      return `<button class="op ${h?'hecho':lado==='izq'&&P.izq===i?'sel':lado==='der'&&P.mal===i?'mal':''}" data-${lado}="${i}" ${h||fin?'disabled':''}>${esc(q.opciones[i][k])}</button>`}).join('')}</div>`;
    cuerpo=`<p class="muted">Toque un elemento de la izquierda y luego su pareja.</p><div class="pares">${col(P.ord,'izq',0)}${col(P.ord2,'der',1)}</div>`;
  }else{
    listo=P.sel!==null;
    if(q.tipo==='completar')enun=enun.replace('___',`<span class="hueco">${P.sel!==null?esc(q.opciones[P.sel]):'&nbsp;'}</span>`);
    cuerpo=`<div class="ops">${P.ord.map(i=>`<button class="op ${fin?(i===q.correcta?'bien':i===P.sel?'mal':''):(i===P.sel?'sel':'')}" data-op="${i}" aria-pressed="${i===P.sel}" ${off}>${esc(q.opciones[i])}</button>`).join('')}</div>`;
  }
  let pie=q.tipo==='emparejar'?'':`<button class="btn" data-comprobar ${listo?'':'disabled'}>${Z.tipo==='examen'?'Responder':'Comprobar'}</button>`;
  if(fin){
    const correcta=textoCorrecta(q);
    pie=`<section class="sello ${P.res?'':'nc'}" role="status" aria-live="polite">
      <p class="marca">${P.res?`Conforme · +${Z.tipo==='leccion'?10:5} XP`:'No conforme'}</p>
      ${P.res?'':`<p><b>Respuesta correcta:</b> ${esc(correcta)}</p>`}
      <p>${P.res?'':'<b>Por qué:</b> '}${esc(q.explicacion)}</p>
      <p class="ref">${esc(q.referencia)}</p>
      ${P.res?'':'<p class="muted">Esta pregunta vuelve hoy en el Repaso del día.</p>'}
      <button class="btn" data-seguir id="seguir">Continuar</button></section>`;
  }
  app.innerHTML=`<div class="top"><button class="salir" data-salir aria-label="Salir de la sesión">Salir</button>
    <div class="barra" role="progressbar" aria-valuemin="0" aria-valuemax="${Z.cola.length}" aria-valuenow="${Z.i}"><i style="width:${100*(Z.i+(fin?1:0))/Z.cola.length}%"></i></div>
    <span class="muted">${Z.i+1}/${Z.cola.length}</span></div>
  <p class="tipo">${Z.tipo==='examen'?'Simulacro · ':''}${TIPOS[q.tipo]}</p><h3>${enun}</h3>${cuerpo}${pie}`;
  if(fin){const b=document.getElementById('seguir');b.focus({preventScroll:true});b.scrollIntoView({block:'nearest'})}
}
function resolver(ok){
  P.res=ok; S.cajas[P.q.id]=leitner(S.cajas[P.q.id],ok,hoy());
  if(ok){const x=Z.tipo==='leccion'?10:5;Z.ok++;Z.xp+=x;S.xp+=x}
  else if(Z.tipo==='examen')Z.fallas.push(P.q.id);
  if(S.sesion)Object.assign(S.sesion,{i:Z.i+1,ok:Z.ok,xp:Z.xp,fallas:Z.fallas});
  guardar();
  // En el simulacro no se muestra la corrección: se pasa a la siguiente y todo se revisa al final.
  // shortcut: en «emparejar» el par equivocado se sigue marcando en rojo al tocarlo; ocultarlo si el simulacro debe ser 100 % ciego.
  if(Z.tipo==='examen')return ++Z.i<Z.cola.length?nueva():terminar();
  pregunta();
}
function terminar(){
  sumarRacha(S,hoy());
  if(Z.tipo==='examen'){delete S.sesion;resultadoExamen();guardar();window.scrollTo(0,0);return}
  const u=Z.clave&&B.unidades.find(x=>Z.clave.startsWith(x.id+'L')), antes=u&&moduloOk(u);
  if(Z.clave)S.lecc[Z.clave]=Math.max(S.lecc[Z.clave]||0,Z.ok);
  delete S.sesion; guardar();
  const f=Z.cola.length-Z.ok, falta=Math.ceil(APRUEBA*Z.cola.length), ap=Z.ok>=falta;
  const aviso=!Z.clave?'':!ap?`<p>Necesita ${falta} de ${Z.cola.length} para aprobarla y abrir la siguiente. Repítala cuando quiera.</p>`
    :u&&!antes&&moduloOk(u)?`<p><b>Módulo aprobado.</b> ${B.unidades.indexOf(u)<B.unidades.length-1?'Se abrió el siguiente módulo.':'Se abrió la evaluación final.'}</p>`:'';
  app.innerHTML=`<div class="fin"><h1>${Z.tipo==='leccion'?(ap?'Lección aprobada':'Lección no aprobada'):'Repaso completado'}</h1>${aviso}
  <div class="medidores">
    <div class="medidor"><b>${Z.ok}/${Z.cola.length}</b><span>Aciertos</span></div>
    <div class="medidor xp"><b>+${Z.xp}</b><span>XP</span></div>
    <div class="medidor"><b>${S.racha}</b><span>Racha (días)</span></div>
  </div>
  <p>${f?`${f} ${f===1?'pregunta fallada queda':'preguntas falladas quedan'} en el Repaso del día.`:'Sin fallos. Las preguntas volverán en repasos más espaciados.'}</p>
  <button class="btn" data-salir>Volver a la ruta</button></div>`;
}

// Chat: dentro del Artifact responde Claude (capacidad «sample», sin clave); en la PWA responde Gemini con la clave
// que el Señor pega. La clave vive solo en este dispositivo, fuera del progreso que se sincroniza o se copia.
// shortcut: se envía la base completa (~85 KB) en cada pregunta; si el costo o la latencia molestan, enviar solo las secciones afines.
const KG='rutaSIG.gemini', GEMINI='https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent';
const REGLAS=`Usted es Jarvis, tutor del Sistema Integrado de Gestión (ISO 9001, ISO 14001, ISO 45001, SG-SST de Colombia, ISO 19011, auditoría y marco legal colombiano). Trate al usuario de «Señor».
Responda SOLO con la BASE DE CONOCIMIENTO de abajo. Si la respuesta no está en ella, dígalo con claridad («Eso no está en la base estudiada») y no invente.
Cite la norma y la cláusula o la ley. No reproduzca texto literal de las normas: explique con palabras propias. Si la base marca algo como «(verificar)», adviértalo.
Cuando aplique, responda en capas: qué exige, cómo se evidencia, cómo se audita (hallazgo típico) y un ejemplo.
Escriba en español, en texto plano sin Markdown (sin asteriscos ni almohadillas), en menos de 200 palabras salvo que el Señor pida más detalle.`;
let CH=[], KB, ocupado=false, muestra;
const clave=()=>{try{return localStorage.getItem(KG)||''}catch(e){return ''}};
async function preguntar(alTexto){
  KB=KB||await fetch('conocimiento.md').then(r=>{if(!r.ok)throw{code:'base'};return r.text()});
  const reglas=REGLAS+'\n\nBASE DE CONOCIMIENTO:\n'+KB, turnos=CH.slice(-9); // impar: empieza y termina en el Señor
  if(muestra)return (await muestra([{role:'user',content:reglas},...turnos.map(m=>({role:m.de==='yo'?'user':'assistant',content:m.t}))],
    {cache:false,onText:({text})=>alTexto(text)})).text;
  const r=await fetch(GEMINI,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':clave()},
    body:JSON.stringify({systemInstruction:{parts:[{text:reglas}]},contents:turnos.map(m=>({role:m.de==='yo'?'user':'model',parts:[{text:m.t}]}))})});
  if(!r.ok)throw{code:r.status};
  const c=(await r.json()).candidates, t=((c&&c[0]&&c[0].content&&c[0].content.parts)||[]).map(p=>p.text||'').join('').trim();
  if(!t)throw{code:'vacio'};
  return t;
}
function chat(){
  Z=P=null;
  const cab=`<div class="top"><button class="salir" data-salir>Volver</button><h2>Pregunte a Jarvis</h2></div>`;
  if(window.claude&&muestra===undefined)return app.innerHTML=cab+'<p class="muted" id="hilo">Conectando con Claude…</p>';
  if(!muestra&&!clave())return app.innerHTML=`${cab}
    <p>Para conversar en esta versión se usa Gemini con una clave suya. Créela gratis en <b>aistudio.google.com/apikey</b> con su cuenta de Google y péguela aquí.</p>
    <label for="clave" class="muted">Clave de la API de Gemini</label><input id="clave" type="password" autocomplete="off" spellcheck="false">
    <button class="btn" data-clave>Guardar la clave</button>
    <p class="muted" id="msg" role="status">La clave se guarda solo en este dispositivo y solo se envía a Google al preguntar.</p>`;
  app.innerHTML=`${cab}
  <p class="muted">Responde con la base de conocimiento SIG estudiada. Necesita conexión a internet.</p>
  <div class="chat" id="hilo" aria-live="polite">${CH.map(m=>`<p class="msg ${m.de}">${esc(m.t)}</p>`).join('')||'<p class="muted">Ejemplo: ¿Qué evidencia pide el auditor para la competencia (7.2)?</p>'}
    ${ocupado?'<p class="msg jarvis" id="vivo">Pensando…</p>':''}</div>
  <label for="duda" class="muted">Su pregunta</label><textarea id="duda" rows="3" maxlength="1000"></textarea>
  <button class="btn" data-enviar ${ocupado?'disabled':''}>Preguntar</button>
  <p class="muted" id="msg" role="status"></p>
  ${muestra?'':'<button class="salir" data-borrarclave>Quitar la clave de este dispositivo</button>'}`;
}
const FALLO={not_granted:'No se autorizó el uso de Claude en esta página.',rate_limited:'Se alcanzó el límite de uso. Intente más tarde.',429:'Se alcanzó el límite de uso de la clave. Intente más tarde.',
  400:'Gemini rechazó la solicitud. Revise que la clave sea correcta.',401:'La clave no es válida.',403:'La clave no es válida o no tiene permiso.',base:'No se pudo cargar la base de conocimiento.',vacio:'No llegó respuesta. Reformule la pregunta.'};
async function enviar(){
  const t=document.getElementById('duda').value.trim(); if(!t||ocupado)return;
  CH.push({de:'yo',t}); ocupado=true; chat(); document.getElementById('vivo').scrollIntoView({block:'nearest'});
  let err='';
  try{CH.push({de:'jarvis',t:await preguntar(x=>{const v=document.getElementById('vivo');if(v)v.textContent=x})})}
  catch(e){CH.pop();err=FALLO[e&&e.code]||'No se pudo obtener respuesta. Revise la conexión e intente de nuevo.'}
  ocupado=false;
  if(!document.getElementById('hilo'))return; // el Señor salió del chat mientras llegaba la respuesta
  chat();
  if(err){document.getElementById('duda').value=t;mensaje(err)}
  else document.getElementById('hilo').lastElementChild.scrollIntoView({block:'nearest'});
}

app.onclick=e=>{
  const b=e.target.closest('button'); if(!b||b.disabled)return; const d=b.dataset;
  if('salir' in d)return inicio();
  if('chat' in d)return chat();
  if('enviar' in d)return enviar();
  if('clave' in d){
    const v=document.getElementById('clave').value.trim();
    if(v.length<20)return mensaje('Pegue la clave completa.');
    try{localStorage.setItem(KG,v)}catch(e){return mensaje('Este navegador no permite guardar la clave.')}
    return chat();
  }
  if('borrarclave' in d){try{localStorage.removeItem(KG)}catch(e){}return chat()}
  if('todo' in d){todo=!todo;try{todo?localStorage.setItem(KT,'1'):localStorage.removeItem(KT)}catch(e){}return inicio()}
  if('repaso' in d)return empezar('repaso',pendientes());
  if('continuar' in d)return reanudar();
  if('examen' in d)return empezar('examen',armarExamen());
  if('copiar' in d){
    const t=document.getElementById('codigo');
    try{navigator.clipboard.writeText(t.value).then(()=>mensaje('Código copiado. Guárdelo en un lugar seguro.'),()=>{t.select();mensaje('Seleccioné el código: cópielo con el menú del teléfono.')})}
    catch(e){t.select();mensaje('Seleccioné el código: cópielo con el menú del teléfono.')}
    return;
  }
  if('restaurar' in d){
    let nuevo;
    try{nuevo=leerCodigo(document.getElementById('restaurar').value)}catch(e){return mensaje('El código no es válido. Revise que esté completo y empiece por SIG1.')}
    if(!confirmar){confirmar=true;b.textContent='Toque otra vez: reemplaza su progreso actual';return}
    S=nuevo; guardar(); inicio();
    document.querySelector('details').open=true;
    return mensaje(`Progreso restaurado: ${S.xp} XP y ${Object.keys(S.cajas).length} preguntas vistas.`);
  }
  if(d.oido){S.oidos[d.oido]=1;guardar();return inicio()}
  if(d.u)return empezar('leccion',tanda(d.u,+d.l),d.u+'L'+d.l);
  if('seguir' in d)return ++Z.i<Z.cola.length?nueva():terminar();
  const q=P.q;
  if('comprobar' in d)return resolver(q.tipo==='ordenar'?P.sec.every((v,k)=>v===k):P.sel===q.correcta);
  if(d.op)P.sel=+d.op;
  else if(d.poner)P.sec.push(+d.poner);
  else if(d.quitar)P.sec=P.sec.filter(i=>i!==+d.quitar);
  else if(d.izq){P.izq=+d.izq;P.mal=null}
  else if(d.der&&P.izq!==null){
    // Se compara el texto, no la posición: dos parejas pueden compartir el mismo texto a la derecha.
    if(q.opciones[+d.der][1]===q.opciones[P.izq][1]){P.hechos.push(P.izq);P.hechosD.push(+d.der);P.mal=null}else{P.err++;P.mal=+d.der}
    P.izq=null;
    if(P.hechos.length===q.opciones.length)return resolver(P.err===0);
  }
  pregunta();
};

// Al terminar el audio se abre la lección 1 del módulo ('ended' no burbujea: se escucha en captura).
app.addEventListener('ended',e=>{const u=e.target.dataset&&e.target.dataset.audio;if(u&&!S.oidos[u]){S.oidos[u]=1;guardar();inicio()}},true);

if(window.claude&&window.claude.use)window.claude.use('sample').then(s=>{muestra=s;if(document.getElementById('hilo'))chat()});
fetch('banco_preguntas.json').then(r=>r.json()).then(b=>{B=b;inicio();nube()})
  .catch(()=>{app.innerHTML='<h1>Ruta SIG</h1><p>No se pudo cargar el banco de preguntas. Revise la conexión y vuelva a abrir la página.</p>'});
</script>
